<!doctype html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

<head th:insert="~{common :: commonHead}">
  <title>Login Page</title>
</head>

<body>
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <h1 class="text-center mb-4">로그인</h1>

      <!-- 에러 메시지 -->
      <div th:if="${errorMsg}" class="alert alert-danger" th:text="${errorMsg}"></div>

      <!-- 로그아웃 메시지 -->
      <div th:if="${logoutMsg}" class="alert alert-success" th:text="${logoutMsg}"></div>

      <!-- 로그인 성공 메시지 -->
      <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

      <form method="post" th:action="@{/login}">
        <div class="form-floating mb-2">
          <input type="email" id="username" name="username" class="form-control" placeholder="Email" required autofocus>
          <label for="username">Email address</label>
        </div>

        <div class="form-floating mb-3">
          <input type="password" id="password" name="password" class="form-control" placeholder="Password" required>
          <label for="password">Password</label>
        </div>

        <div class="d-grid">
          <button class="btn btn-primary btn-lg" type="submit">Sign In</button>
        </div>

        <div class="text-center mt-3">
          <a class="btn btn-outline-secondary" th:href="@{/auth/signup}">Sign Up</a>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Bootstrap JS 삽입 -->
<div th:insert="~{common :: commonScript}"></div>
</body>
</html>
